# Nginx reverse proxy for qlip.techfamz.com -> Next.js (PM2 "qlip-web", 127.0.0.1:3000)
#
# Install on the VPS:
#   sudo cp deploy/nginx-qlip-web.conf /etc/nginx/sites-available/qlip.techfamz.com
#   sudo ln -s /etc/nginx/sites-available/qlip.techfamz.com /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then obtain SSL certificate with certbot:
#   sudo certbot --nginx -d qlip.techfamz.com
#

server {
    listen 80;
    listen [::]:80;
    server_name qlip.techfamz.com;

    client_max_body_size 20m;

    # Compression for text, css, js, svg
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache immutable static Next.js assets
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }
}
